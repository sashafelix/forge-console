name: Package desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            command: npx electron-builder --mac --arm64 --publish never
            artifact: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            command: npx electron-builder --mac --x64 --publish never
            artifact: macos-x64
          - name: Windows x64
            os: windows-latest
            command: npx electron-builder --win --x64 --publish never
            artifact: windows-x64
          - name: Linux x64
            os: ubuntu-latest
            command: npx electron-builder --linux --x64 --publish never
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build application
        run: npm run build
      - name: Package desktop application
        run: ${{ matrix.command }}
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-pipeline-ui-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
